name: doctrine-contract

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check doctrine contract map against spec files
        run: python3 tools/ci/check_doctrine_contract.py
