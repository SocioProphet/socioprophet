name: check

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python deps
        run: python -m pip install --upgrade pip && python -m pip install pyyaml

      - name: Run checks
        run: ./scripts/check.sh
