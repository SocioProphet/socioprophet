<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="SocioProphet Platform Website" />
    <meta
      name="keywords"
      content="SocioProphet, AI, open intelligence, data, cloud, network, social, social network, platform, community, sp, socioprophetweb, developer, learning, collaboration, search, reddit, hackernews, analytics, decentralized, democratized, workflow, federarted"
    />
    <meta name="author" content="William Jones" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <title>SocioProphet</title>

    <!-- Loader styles -->
    <style>
      .loader-container {
        font-size: 40px;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
      }

      .loader {
        /* border: 16px solid #f3f3f3; */
        border-top: 16px solid #333;
        border-radius: 50%;
        width: 130px;
        height: 130px;
        margin-left: calc(50% - 73px);
        margin-top: 6rem;
        animation: spin 2s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Google Analytics -->
    <script>
      window.ga =
        window.ga ||
        function () {
          (ga.q = ga.q || []).push(arguments);
        };
      ga.l = +new Date();
      ga('create', 'UA-184834195-1', 'auto');
      ga('send', 'pageview');
    </script>
    <script async src="https://www.google-analytics.com/analytics.js"></script>
    <script type="text/javascript">
      if (window.location.href !== 'http://localhost:8081/') {
        if (window.location.href === 'https://socioprophet.com/') {
          window.location.href = 'https://www.socioprophet.com';
        }
      }
    </script>
    <script src="/firebase-config.js"></script>
</head>
  <body>
    <div id="root">
      <div class="loader-container">
        <div class="loader"></div>
        SocioProphet
      </div>
    </div>
    <!-- Client side Google api -->
    <script
      src="https://apis.google.com/js/api.js?onload=onGoogleScriptLoad"
      type="text/javascript"
      async
      defer
    ></script>
  </body>
</html>
