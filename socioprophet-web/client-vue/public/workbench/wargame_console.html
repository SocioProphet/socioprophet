<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wargames Console</title></head><body><div id="root"></div><script>/* SP-PRIMITIVES-001 — self-contained object library.
   Injects its own <style> (SP-PRIM-2: never renders unstyled).
   Every primitive is a pure spec->DOMString function (SP-PRIM-3). */
(function(){
const CSS = `
:root{
  --page:#f7f8fa;--card:#fff;--line:#e8ebf0;--line-2:#dde2ea;
  --nav:#101827;--nav-2:#1b2434;--nav-ink:#8a97a8;
  --ink:#1a2230;--ink-dim:#5a6b82;--ink-faint:#8a99ad;
  --red:#e5484d;--amber:#f5a623;--blue:#3b82f6;--green:#22a565;--violet:#7c5cff;
  --red-bg:#fdeced;--amber-bg:#fdf3e3;--blue-bg:#eaf1fe;--green-bg:#e4f6ee;--violet-bg:#efeaff;
  --device:#7c5cff;--device-bg:#efeaff;--user:#3b82f6;--user-bg:#eaf1fe;
  --vuln:#12b3a6;--vuln-bg:#e0f6f3;--software:#ff7a3c;--software-bg:#ffeee4;
  --facility:#f5a623;--facility-bg:#fdf3e3;--net:#12b3a6;--net-bg:#e0f6f3;
  --group:#e5484d;--group-bg:#fdeced;
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,'Segoe UI',sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
.mono{font-family:'Roboto Mono',ui-monospace,monospace}
button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:204px 1fr;height:100vh;overflow:hidden}
/* nav */
.nav{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;overflow-y:auto}
.nav .brand{display:flex;align-items:center;gap:9px;padding:18px 18px 16px;color:#fff;font-weight:800;font-size:16px}
.nav .brand .mk{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--violet),var(--blue))}
.nav .search{margin:0 14px 12px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:#0a111d;color:var(--nav-ink);font-size:12px}
.nav .search input{border:0;background:transparent;color:#cfd8e3;outline:none;width:100%;font-size:12px}
.nav .group{padding:2px 10px}
.nav .glabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#4a5666;padding:12px 12px 5px}
.nav .item{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:7px;color:var(--nav-ink);font-size:12.5px;font-weight:500}
.nav .item .ic{width:16px;text-align:center;opacity:.85}
.nav .item:hover{background:#161f2e;color:#cfd8e3}.nav .item.active{background:var(--nav-2);color:#fff}
.nav .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid #1b2434}
.nav .foot .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#2e86ff);flex:none}
.nav .foot .who{font-size:12px;color:#cfd8e3;line-height:1.3}.nav .foot .who small{color:var(--nav-ink);font-size:10.5px}
.main{overflow-y:auto;position:relative}
.topbar{display:flex;align-items:center;gap:10px;padding:0 24px;height:54px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10}
.crumb{color:var(--ink-faint);font-size:13px}.crumb b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.btn{display:flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);color:var(--ink);font-size:12px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.wrap{padding:22px 24px;max-width:1520px}
.page-h h1{margin:0 0 5px;font-size:20px;font-weight:700}.page-h p{margin:0;color:var(--ink-dim);font-size:12.5px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600}
.chip.green{background:var(--green-bg);color:var(--green)}.chip.amber{background:var(--amber-bg);color:#b9791a}
.chip.blue{background:var(--blue-bg);color:var(--blue)}.chip.red{background:var(--red-bg);color:var(--red)}
.chip.grey{background:#eef1f5;color:var(--ink-dim)}.chip.violet{background:var(--violet-bg);color:var(--violet)}
.chip.filter{border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-weight:500;padding:4px 9px}
.chip.filter .x{color:var(--ink-faint);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.card .ch{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.card .ch h3{margin:0;font-size:14px;font-weight:600}.card .cb{padding:16px}
.metric .th{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-dim);font-weight:500}
.metric .th .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px}
.metric .num{font-size:32px;font-weight:700;margin-top:10px;letter-spacing:-.02em}
.metric .delta{font-size:11px;color:var(--ink-faint);margin-top:4px}
/* node object (P-NODE) — the canonical Axonius node */
.pnode{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transform:translate(-50%,-50%);transition:transform .15s}
.pnode:hover{z-index:6}.pnode:hover .bub{transform:scale(1.06)}
.pnode .bub{position:relative;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
.pnode .bub .cnt{position:absolute;top:-3px;right:-9px;background:#2a3446;color:#fff;font-family:'Roboto Mono',monospace;font-weight:600;padding:2px 7px;border-radius:9px;font-size:10.5px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pnode .lbl{font-size:12px;font-weight:500;white-space:nowrap}
.pnode.static{position:relative;transform:none}
/* canvas */
.canvas{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.canvas .hint{position:absolute;top:14px;left:16px;font-size:11px;color:var(--ink-faint);z-index:2}
.canvas svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.elabel{font-size:10px;fill:var(--ink-faint);font-family:Inter}
/* toolbar */
.gtoolbar{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:5px;z-index:3}
.gtoolbar button{width:30px;height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--card);color:var(--ink-dim);font-size:13px}
/* verdict */
.pverdict{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.pverdict .vh{padding:8px 12px;background:var(--nav);color:#fff;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.pverdict .vr{display:flex;justify-content:space-between;padding:8px 12px;font-size:11.5px;border-bottom:1px solid var(--line)}
.pverdict .vr:last-child{border-bottom:0}.pverdict .vr .k{color:var(--ink-dim);font-family:'Roboto Mono',monospace;font-size:10.5px}
.pverdict .vr .v{font-weight:600;font-size:10.5px}
.v-pos{color:var(--green)}.v-neg{color:var(--red)}.v-zero{color:var(--ink-faint)}
.pverdict .note{margin:10px 12px;padding:9px 11px;border-radius:8px;background:var(--red-bg);border:1px solid #ffccd4;color:#c31b38;font-size:10.5px;line-height:1.5}
/* bars */
.pbars .brow{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:12px}
.pbars .brow .bn{color:var(--ink-dim);font-size:11.5px}
.pbars .brow .track{height:18px;border-radius:5px;background:#eef1f5;overflow:hidden}
.pbars .brow .track i{display:block;height:100%;border-radius:5px}
.pbars .brow .bv{font-family:'Roboto Mono',monospace;font-size:11px;text-align:right}
/* steps */
.psteps .step{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:var(--card)}
.psteps .step.active{border-color:var(--blue);background:var(--blue-bg)}
.psteps .step .op{display:flex;justify-content:space-between;font-size:12px}.psteps .step .op b{color:var(--ink)}
.psteps .step .op .c{font-family:'Roboto Mono',monospace;color:var(--blue);font-size:11px}
.psteps .step .d{font-size:10.5px;color:var(--ink-dim);margin-top:2px}
.psteps .step.start{border-style:dashed;color:var(--ink-dim)}
/* dag */
.pdag .node{background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:11px 14px;width:340px;margin:0 auto;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.pdag .node.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
.pdag .node .nh{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--ink-faint)}
.pdag .node .nh .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:#fff}
.pdag .node .nb{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;font-weight:500}
.pdag .node .runson{margin-left:auto;font-size:10.5px;color:var(--ink-faint);font-weight:400;background:var(--page);padding:2px 7px;border-radius:5px}
.pdag .conn{width:2px;height:22px;background:var(--line-2);margin:0 auto}
`;
// inject style once
if(!document.getElementById('sp-prim-style')){
  const s=document.createElement('style');s.id='sp-prim-style';s.textContent=CSS;document.head.appendChild(s);
  const f=document.createElement('link');f.rel='stylesheet';f.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap';document.head.appendChild(f);
}

const PAL={device:['var(--device)','var(--device-bg)'],user:['var(--user)','var(--user-bg)'],
 vuln:['var(--vuln)','var(--vuln-bg)'],software:['var(--software)','var(--software-bg)'],
 facility:['var(--facility)','var(--facility-bg)'],net:['var(--net)','var(--net-bg)'],
 group:['var(--group)','var(--group-bg)'],blue:['var(--blue)','var(--blue-bg)'],
 green:['var(--green)','var(--green-bg)'],amber:['var(--amber)','var(--amber-bg)'],
 red:['var(--red)','var(--red-bg)'],violet:['var(--violet)','var(--violet-bg)']};
const fmt=n=>{n=+n;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':''+n};
const rOf=(count,tier)=>{const v=typeof count==='string'?(count.includes('K')?parseFloat(count)*1000:parseInt(count)):count;return Math.max(18,Math.min(52,16+Math.sqrt(v||1)*1.0))};

const SP={
  fmt,PAL,
  // P-NODE
  node(s){
    const [fg,bg]=PAL[s.type]||PAL.device;
    const r=s.size||rOf(s.count,s.tier);
    const pos=(s.x!=null)?`left:${s.x}%;top:${s.y}%`:'';
    const cls='pnode'+(s.x==null?' static':'');
    return `<div class="${cls}" style="${pos}" ${s.onclick?`onclick="${s.onclick}"`:''}>
      <div class="bub" style="width:${r*2}px;height:${r*2}px;background:${bg};border:${s.tier==='inferred'?3:2.5}px solid ${fg}">
        <span style="font-size:${r*0.72}px;color:${fg};font-weight:700">${s.icon||'▦'}</span>
        ${s.count!=null?`<span class="cnt">${fmt(s.count)}</span>`:''}
      </div><div class="lbl">${s.label}</div></div>`;
  },
  // P-CARD.metric
  metric(s){
    const [fg,bg]=PAL[s.sev||'blue'];
    return `<div class="card metric"><div class="cb"><div class="th">
      ${s.icon?`<span class="ic" style="background:${bg};color:${fg}">${s.icon}</span>`:''}${s.label}
      ${s.drill?'<span style="margin-left:auto;color:var(--ink-faint)">↗</span>':''}</div>
      <div class="num" style="color:${s.color||'inherit'}">${s.value}</div>
      ${s.delta?`<div class="delta">${s.delta}</div>`:''}</div></div>`;
  },
  card(s){ // generic titled card with body html
    return `<div class="card"><div class="ch"><h3>${s.title}</h3>${s.right||''}</div><div class="cb">${s.body||''}</div></div>`;
  },
  chip(text,kind){return `<span class="chip ${kind||'grey'}">${text}</span>`;},
  tier(t){const m={t1:['green','T1'],t2:['blue','T2'],inferred:['red','INFERRED']};const[k,l]=m[t]||m.t1;return SP.chip(l,k);},
  // P-VERDICT
  verdict(rows,note){
    const vc=v=>['POS','admissible','PASS'].includes(v)?'v-pos':['NEG','blocked','FAIL'].some(x=>String(v).includes(x))?'v-neg':'v-zero';
    return `<div class="pverdict"><div class="vh">${rows.title||'verdict'}</div>
      ${rows.items.map(([k,v])=>`<div class="vr"><span class="k">${k}</span><span class="v ${vc(v)}">${v}</span></div>`).join('')}
      ${note?`<div class="note">⊘ ${note}</div>`:''}</div>`;
  },
  // P-BARS.h
  bars(rows,opts){
    const mx=opts&&opts.max||Math.max(...rows.map(r=>r.value));
    return `<div class="pbars">${rows.map(r=>`<div class="brow"><span class="bn">${r.label}</span>
      <div class="track"><i style="width:${r.value/mx*100}%;background:${r.color||'var(--violet)'}"></i></div>
      <span class="bv" ${r.hot?'style="color:var(--red)"':''}>${typeof r.value==='number'?r.value.toLocaleString():r.value}</span></div>`).join('')}</div>`;
  },
  // P-PIE / donut
  pie(segs,opts){
    opts=opts||{};const R=opts.r||58,cx=R+7,cy=R+7,sw=opts.donut?13:R,S=(R+7)*2;
    const tot=segs.reduce((s,x)=>s+x.value,0);let a0=-90,out='';
    const track=opts.donut?`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#eef1f5" stroke-width="${sw}"/>`:'';
    segs.forEach(sg=>{const f=sg.value/tot,len=f*2*Math.PI*R,circ=2*Math.PI*R;
      if(opts.donut){out+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${sg.color}" stroke-width="${sw}" stroke-dasharray="${len-3} ${circ-len+3}" stroke-dashoffset="${-(a0+90)/360*circ}" transform="rotate(-90 ${cx} ${cy})"/>`;}
      else{const x1=cx+R*Math.cos(a0*Math.PI/180),y1=cy+R*Math.sin(a0*Math.PI/180),a1=a0+f*360,x2=cx+R*Math.cos(a1*Math.PI/180),y2=cy+R*Math.sin(a1*Math.PI/180),la=f>0.5?1:0;out+=`<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${la} 1 ${x2},${y2} Z" fill="${sg.color}"/>`;}
      a0+=f*360;});
    return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${track}${out}</svg>`;
  },
  // P-STEPS
  steps(list){return `<div class="psteps">${list.map(s=>s.start?`<div class="step start"><div class="op"><b>⑂ ${s.op}</b></div></div>`:`<div class="step${s.active?' active':''}"><div class="op"><b>${s.op}</b>${s.count!=null?`<span class="c">${s.count}</span>`:''}</div>${s.desc?`<div class="d">${s.desc}</div>`:''}</div>`).join('')}</div>`;},
  // P-DAG
  dagNode(s){const ic={trigger:'#7c5cff',condition:'#f5a623',action:'#e5484d',delay:'#12b3a6',event:'#22a565'}[s.kind]||'#7c5cff';
    return `<div class="node${s.sel?' sel':''}"><div class="nh"><span class="ic" style="background:${ic}">${s.glyph||'⚡'}</span>${s.title}</div><div class="nb">${s.body}${s.runson?`<span class="runson">${s.runson}</span>`:''}</div></div>`;},
  dagConn(){return '<div class="conn"></div>';},
  // P-EDGE (svg string for a canvas)
  edge(x1,y1,x2,y2,o){o=o||{};const col=o.kind==='signal'?'var(--red)':o.kind==='flow'?'var(--green)':'#c9d2de';
    const mx=(x1+x2)/2,my=(y1+y2)/2;const path=o.curve?`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`:`M${x1},${y1} L${x2},${y2}`;
    return `<path d="${path}" fill="none" stroke="${col}" stroke-width="${o.w||1.3}" ${o.dash?'stroke-dasharray="3 3"':''}/>`+(o.verb?`<text x="${mx}" y="${my-4}" text-anchor="middle" class="elabel">${o.verb}</text>`:'');},
  toolbar(){return `<div class="gtoolbar"><button>✥</button><button>❋</button><button>⊡</button><button>＋</button><button>－</button></div>`;},
  // P-SHELL / nav
  nav(active){
    const items=[['Workbench',[['dashboard.html','▤','Dashboard','D'],['a1_start.html','⬡','Asset Graph','AG'],['a14_table.html','▦','Inventory','IN'],['activities.html','≣','Activities','AC']]],
      ['Operate',[['operator_console.html','◎','Operator Console','OC'],['ec1_workflows.html','⚡','Enforcement','EC'],['ec5_runs.html','↻','Run History','RH']]],
      ['Domains',[['scoped_console.html','⛨','SCOPE-D','SD'],['orion_console.html','◍','Orion','OR'],['wargame_console.html','♟','Wargames','WG']]],
      ['Observability',[['mesh_graph.html','◉','Mesh Graph','ME'],['asset_map.html','◍','Asset Map','MP']]],
      ['Configure',[['a20_adapters.html','⧉','Adapters','AD'],['a22_queries.html','❏','Saved Queries','QR']]]];
    return `<aside class="nav"><div class="brand"><span class="mk"></span>SocioProphet</div>
      <div class="search">⌕ <input placeholder="Search  Ctrl+Y"></div>
      <div class="group">${items.map(([g,its])=>`<div class="glabel">${g}</div>`+its.map(([h,ic,l,k])=>`<a class="item${k===active?' active':''}" href="${h}"><span class="ic">${ic}</span>${l}</a>`).join('')).join('')}</div>
      <div class="foot"><div class="av"></div><div class="who">Michael Heller<br><small>mdheller · operator</small></div></div></aside>`;
  },
  shell(active,crumb,topRight,wrapHtml){
    return `<div class="app">${SP.nav(active)}<main class="main">
      <div class="topbar"><div class="crumb">${crumb}</div><div class="sp"></div>${topRight||''}</div>
      <div class="wrap" style="max-width:none">${wrapHtml}</div></main></div>`;
  },
};
window.SP=SP;
})();
</script><script>
const HUB={label:'Position \u03a3',icon:'\u265f',count:null,type:'violet',size:40};
const SAT=[
 {label:'Agent A',icon:'\u2659',count:'12',type:'blue',x:24,y:26,verb:'move',kind:'flow',curve:true},
 {label:'Agent B',icon:'\u265f',count:'9',type:'red',x:76,y:26,verb:'move',kind:'flow',curve:true},
 {label:'Contested node',icon:'\u2b22',count:'3',type:'amber',x:50,y:70,verb:'influence',kind:'signal',curve:true},
 {label:'Ally',icon:'\u2659',count:'5',type:'green',x:20,y:68,verb:'coordinate',kind:'flow',curve:true},
];
function domainCanvas(){var CX=42,CY=48;var edges="";SAT.forEach(function(s){edges+=SP.edge(CX,CY,s.x,s.y,{verb:s.verb,w:1.2,curve:s.curve,kind:s.kind});});var nodes=SP.node(Object.assign({},HUB,{x:CX,y:CY}))+SAT.map(function(s){return SP.node(s);}).join("");return '<div class="canvas" style="height:540px"><div class="hint">Wargames \u00b7 agent positions \u00b7 coercion-resistant protocol</div>'+'<svg class="edges" viewBox="0 0 100 100" preserveAspectRatio="none" style="overflow:visible">'+edges+'</svg>'+nodes+SP.toolbar()+'</div>';}
const phases=[{op:'Phase 1 \u00b7 disclose',count:'\u2713',active:true},{op:'Phase 2 \u00b7 commit',count:'\u2713'},{op:'Phase 3 \u00b7 reveal',count:'pending'},{op:'Phase 4 \u00b7 settle',count:'\u2014'},{op:'Protocol root',start:true}];
document.getElementById('root').innerHTML=SP.shell('WG','<a href="dashboard.html">\u2302</a> \u203a Domains \u203a <b>Wargames</b>',SP.chip('coercion-resistant','violet'),
 '<div class="page-h"><h1>Wargames \u00b7 protocol position</h1><p>Same objects again. Nodes=agents/positions, edges=moves, verdict=move-legality + coercion-resistance, steps=protocol phase stack.</p></div>'
 +'<div style="display:grid;grid-template-columns:230px 1fr 300px;gap:16px">'
 +'<div>'+SP.card({title:'Protocol phases',body:SP.steps(phases)})+'</div>'
 +domainCanvas()
 +'<div>'+SP.verdict({title:'move legality',items:[['author-not-operator','POS'],['no privileged node','POS'],['move admissible','admissible'],['coercion resistance','POS']]})
 +'<div style="height:12px"></div>'+SP.card({title:'Force tempo',body:SP.bars([{label:'Agent A tempo',value:12,color:'var(--blue)'},{label:'Agent B tempo',value:9,color:'var(--red)'},{label:'Contested',value:3,color:'var(--amber)'}])})+'</div></div>');
</script></body></html>
